name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          # Cần thêm dấu nháy bao quanh đường dẫn và đảm bảo thụt lề chuẩn
          cache-dependency-path: './wedding-invitation/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install
        working-directory: ./wedding-invitation

      - name: Build
        run: pnpm run build
        working-directory: ./wedding-invitation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Đảm bảo đường dẫn này khớp với thư mục build của Vite
          path: './wedding-invitation/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4